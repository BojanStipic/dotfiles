# Styling
set-option -g dark-theme-black '#1e1e2e'
set-option -g dark-theme-white '#cdd6f4'
set-option -g dark-theme-light-grey '#585b70'
set-option -g dark-theme-dark-grey '#45475a'
set-option -g dark-theme-green '#a6e3a1'
set-option -g dark-theme-yellow '#f9e2af'
set-option -g dark-theme-red '#f38ba8'
set-option -g dark-theme-blue '#89b4fa'
set-option -g dark-theme-cyan '#94e2d5'
set-option -g dark-theme-magenta '#cba6f7'

set-option -g light-theme-black '#eff1f5'
set-option -g light-theme-white '#4c4f69'
set-option -g light-theme-light-grey '#bcc0cc'
set-option -g light-theme-dark-grey '#ccd0da'
set-option -g light-theme-green '#40a02b'
set-option -g light-theme-yellow '#df8e1d'
set-option -g light-theme-red '#d20f39'
set-option -g light-theme-blue '#1e66f5'
set-option -g light-theme-cyan '#179299'
set-option -g light-theme-magenta '#8839ef'

set-option -g status-style 'default'
set-option -g status-left '#[bg=themegreen,fg=themeblack,bold]'
set-option -ag status-left '#{?client_prefix,#[bg=thememagenta#,fg=themeblack],}'
set-option -ag status-left '#{?pane_in_mode,#[bg=thememagenta#,fg=themeblack],}'
set-option -ag status-left ' #{session_name} #[bg=terminal] '
set-option -g status-left-length 80
set-option -g status-right ''

set-option -g window-status-current-style 'default'
set-option -g window-status-current-format '#[bg=thememagenta,fg=themeblack,bold] #{window_index} '
set-option -ag window-status-current-format '#[bg=themedarkgrey,fg=themewhite,bold] #{window_name} '
set-option -ag window-status-current-format '#{?window_zoomed_flag,#[fg=thememagenta]  ,}'

set-option -g window-status-format '#[bg=themelightgrey,fg=themewhite,bold] #{window_index} '
set-option -ag window-status-format '#[bg=themedarkgrey,fg=themewhite,none] #{window_name} '
set-option -ag window-status-format '#{?window_zoomed_flag,#[fg=thememagenta]  ,}'

set-option -g pane-active-border-style 'fg=thememagenta'
set-option -g pane-border-style 'fg=themelightgrey'
set-option -g message-style 'fill=terminal'

# Options
set-option -g extended-keys on
set-option -g extended-keys-format csi-u
set-option -g set-clipboard on
set-option -g history-limit 100000
set-option -g escape-time 0
set-option -g display-time 0
set-option -g status-interval 5
set-option -g focus-events on
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g detach-on-destroy off
set-option -g wrap-search off
set-option -g status-keys emacs
set-option -g mode-keys vi
set-option -g mouse on
set-option -g monitor-activity on
set-option -g visual-activity on
set-hook -g alert-activity { display-message -d1 }
set-option -g monitor-bell on
set-option -g visual-bell on
set-hook -g alert-bell { display-message -d1 }

# Bindings
unbind-key -a
set-option -g prefix C-Space
bind-key C-Space send-prefix

bind-key ? list-keys
bind-key : command-prompt
bind-key , { source-file ~/.config/tmux/tmux.conf ; display-message 'Config reloaded.' }
bind-key z detach
bind-key p choose-tree -sZ
bind-key / switch-mode -w

bind-key h if-shell -F '#{pane_at_left}' { previous-window ; select-pane -t :.right } { select-pane -L }
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l if-shell -F '#{pane_at_right}' { next-window ; select-pane -t :.left } { select-pane -R }
bind-key H previous-window
bind-key L next-window
bind-key o last-window
bind-key f resize-pane -Z

bind-key n new-session -c '#{pane_current_path}'
bind-key t new-window -c '#{pane_current_path}'
bind-key w split-window -c '#{pane_current_path}'
bind-key v split-window -h -c '#{pane_current_path}'
bind-key s split-window -v -c '#{pane_current_path}'
bind-key b break-pane
bind-key B join-pane -t ':{previous}'
bind-key K new-pane -x 80% -y 80% -X 10% -Y 10%
bind-key q confirm-before -p 'kill-pane? (y/n)' kill-pane
bind-key Q confirm-before -p 'kill-window #{window_name}? (y/n)' kill-window
bind-key r command-prompt -I '#{window_name}' { rename-window '%%' }
bind-key R command-prompt -I '#{session_name}' { rename-session '%%' }
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9
bind-key 0 select-window -t ':{end}'
bind-key Space display-panes -d0

bind-key '[' rotate-window -U
bind-key ']' rotate-window -D
bind-key '{' { swap-window -t -1 ; previous-window }
bind-key '}' { swap-window -t +1 ; next-window }
set-option -g main-pane-width 60%
bind-key - select-layout main-vertical
set-option -g main-pane-height 50%
bind-key _ select-layout main-horizontal
bind-key m { swap-pane -t 1 ; select-pane -t 1 }
bind-key = select-layout tiled

bind-key Enter copy-mode
bind-key -T copy-mode-vi / command-prompt -i -p '/' -I '#{pane_search_string}' -T search { send-keys -X search-forward-incremental '%%' }
bind-key -T copy-mode-vi ? command-prompt -i -p '?' -I '#{pane_search_string}' -T search { send-keys -X search-backward-incremental '%%' }
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v { send-keys -X begin-selection ; send-keys -X rectangle-on }
bind-key -T copy-mode-vi Escape { send-keys -X clear-selection ; send-keys -X rectangle-off }
bind-key -T copy-mode-vi y send-keys -X copy-pipe
bind-key -T copy-mode-vi H send-keys -X back-to-indentation
bind-key -T copy-mode-vi L send-keys -X end-of-line
bind-key -T copy-mode-vi [ send-keys -X previous-prompt
bind-key -T copy-mode-vi ] send-keys -X next-prompt
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
unbind-key -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi DoubleClick1Pane { select-pane ; send-keys -X select-word }
bind-key -T copy-mode-vi TripleClick1Pane { select-pane ; send-keys -X select-line }
