[bar.default]
start = ["launcher", "workspaces"]
center = ["clock", "weather", "notifications"]
end = [
  "privacy",
  "audio_visualizer",
  "keyboard_layout",
  "volume",
  "brightness",
  "battery",
  "network",
  "bluetooth",
]
margin_ends = 0
radius = 0
scale = 1.1
thickness = 40
padding = 16
widget_spacing = 16

[widget.workspaces]
focused_output_only = true

[widget.clock]
format = "{:%a %-d %b %R}"

[widget.clock.actions]
left = "panel-toggle control-center home"

[widget.notifications]
hide_when_no_unread = true

[widget.privacy]
active_color = "error"
hide_inactive = true

[widget.audio_visualizer.actions]
left = "panel-toggle control-center media"

[widget.network]
show_label = false
vpn_status = "both"

[desktop_widgets]
enabled = false

[control_center]
sidebar = "full"
sidebar_section = "none"
[control_center.calendar]
show_events_card = false
[[control_center.shortcuts]]
type = "wifi"
[[control_center.shortcuts]]
type = "bluetooth"
[[control_center.shortcuts]]
type = "notification"
[[control_center.shortcuts]]
type = "caffeine"
[[control_center.shortcuts]]
type = "nightlight"
[[control_center.shortcuts]]
type = "dark_mode"

[notification]
history_retention_hours = 48
position = "top_center"

[osd]
position = "top_right"

[shell]
clipboard_enabled = false
polkit_agent = true
font_family = "Atkinson Hyperlegible"
settings_show_advanced = false

[shell.keyboard_layout.custom_labels]
"English (US)" = "EN"
"Serbian" = "SR (Cyrl)"
"Serbian (Latin)" = "SR (Latin)"

[shell.panel]
open_near_click_control_center = true
open_near_click_session = true

[shell.launcher]
app_grid = true
[shell.launcher.providers.panels]
global = true
[shell.launcher.providers.session]
global = true

[theme]
builtin = "Catppuccin"
source = "builtin"

[theme.templates]
enable_builtin_templates = false
enable_community_templates = false

[wallpaper]
directory = "~/.local/share/backgrounds"

[brightness]
enable_ddcutil = true

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]
[idle.behavior.lock]
action = "lock"
enabled = false
timeout = 600.0
[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 900.0
[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 1800.0
